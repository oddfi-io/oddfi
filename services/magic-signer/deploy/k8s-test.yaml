# magic-signer test deployment.
#
# Same shape as prod but APP_ENV=test and points at the test Magic app +
# test OIDC private key. The service refuses to start if MAGIC_API_KEY does
# not start with pk_test_, so a misconfigured Secret fails fast.

apiVersion: v1
kind: Service
metadata:
  name: magic-signer
  namespace: test
spec:
  type: ClusterIP
  selector:
    app: magic-signer
  ports:
    - name: https
      port: 443
      targetPort: 8443

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: magic-signer
  namespace: test
  labels:
    app: magic-signer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: magic-signer
  template:
    metadata:
      labels:
        app: magic-signer
    spec:
      automountServiceAccountToken: false
      containers:
        - name: server
          image: magic-signer:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
          env:
            - name: APP_ENV
              value: "test"
            - name: LISTEN_ADDR
              value: ":8443"
            - name: ALLOW_PUBLIC_LISTEN
              value: "1"
            - name: OIDC_KID
              value: "uniq-test-2026"
            - name: OIDC_ISSUER
              value: "https://test.oddfi.io/"
            - name: OIDC_AUDIENCE
              value: "oddfi-app"
            - name: MAGIC_REFERRER
              value: "https://test.oddfi.io"
            - name: MAGIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: magic-signer-secrets-test
                  key: magic_api_key
            - name: MAGIC_OIDC_PROVIDER_ID
              valueFrom:
                secretKeyRef:
                  name: magic-signer-secrets-test
                  key: oidc_provider_id
            - name: OIDC_PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: magic-signer-secrets-test
                  key: oidc_private_key_pem
            - name: CALLER_TOKEN_WEB_API
              valueFrom:
                secretKeyRef:
                  name: magic-signer-secrets-test
                  key: caller_token_web_api
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
            periodSeconds: 10

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: magic-signer
  namespace: test
spec:
  podSelector:
    matchLabels:
      app: magic-signer
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web-api
      ports:
        - port: 8443
          protocol: TCP
