  "删除 internal/api/match_state.go，移除 gin 依赖。",
  "新增 Dockerfile 和 deploy.sh，容器不映射端口，只启动后台结算 worker。",
  "补齐 mysql.tables.fixture_results 配置，支持 oddfi_fixture_results 真实表名。",
  "worker 改为 user_bet_holding.odd_id -> oddfi_odds.odd_id -> oddfi_odds.fixture_id -> oddfi_fixture_results.fixture_id 链路。",
  "新增/完善 PRD 24 条用例单测和本地 E2E seed/assert SQL。",
  "合并上线检查清单到 PROD_RUNBOOK.md，删除中间 PRE_LAUNCH 指针文档。",
  "明确 user_balance.claimable_balance 是生产上线硬依赖。",
  "修正 MySQL 8.4.7 下 ALGORITHM=INSTANT 不能搭配 LOCK=NONE 的 DDL 错误。",
]
bug_fixes = [
  "修正生产 runbook 错误表名 fixture_results，统一为 oddfi_fixture_results。",
  "修正 worker 候选联查 SQL 的 SELECT 尾逗号问题。",
  "修正 claimable_balance 生产 DDL，去掉 MySQL 8.4.7 不支持的 LOCK=NONE。",
  "补充生产缺 claimable_balance 时 Unknown column 风险和上线阻断说明。",
  "补充 AutoMigrate 对生产库权限和表结构的影响说明。",
]
