# DD-003 admin internal endpoint vhost
# 部署目标：/etc/nginx/sites-available/admin-api.oddfi.io
# 启用：sudo ln -s /etc/nginx/sites-available/admin-api.oddfi.io /etc/nginx/sites-enabled/
#
# 关联：cutover-dd003.md §3 / DD-003 §4.2 三层防御
#   第一层：网络层 IP allow（只允 admin EC2）
#   第二层：限流 zone（独立于 api.oddfi.io，DDoS 隔离）
#   第三层：应用层 HMAC + JWT（web-api 进程做）
#
# 前置：
#   1. DNS admin-api.oddfi.io A → <SERVER_IP>
#   2. certbot certonly --nginx -d admin-api.oddfi.io
#   3. nginx.conf 全局 http {} 内已注册 limit_req_zone：
#      limit_req_zone $binary_remote_addr zone=admin_internal:10m rate=10r/s;

server {
    listen 443 ssl http2;
    server_name admin-api.oddfi.io;

    ssl_certificate     /etc/letsencrypt/live/admin-api.oddfi.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin-api.oddfi.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    server_tokens off;

    # 网络层 allow：仅 admin EC2 外网 IP
    # ⚠️ 如 admin EC2 IP 漂移，必须同步改这里 + DNS admin.oddfi.io 双处
    allow <SERVER_IP>;
    deny  all;
    error_page 403 = @forbid;

    # 仅 /internal/ 下放行，其他路径一律 404（避免被作为公网 web-api 边路）
    location /internal/ {
        # 独立限流 zone（与 api.oddfi.io 隔离）
        limit_req zone=admin_internal burst=5 nodelay;

        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # web-api internal 是同机 loopback，超时收紧
        proxy_connect_timeout 3s;
        proxy_send_timeout    5s;
        proxy_read_timeout    10s;
    }

    # health 探测（不限流，运维 ping 用；返回 200 不暴露细节）
    location = /health {
        proxy_pass http://127.0.0.1:8081/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location @forbid {
        return 403 '';
    }

    location / {
        return 404 '';
    }
}

# 注意：不监听 :80
# 原因：oddfi-backend EC2 的 :80 被 web-api 容器占用（host network）。
# admin-api.oddfi.io 是 internal-only 域名，admin-backend 直接发 HTTPS 请求，
# 浏览器用户不访问，不需要 HTTP→HTTPS 重定向。
# certbot 续期用 standalone 模式 + pre/post hook 停启 web-api 释放 :80
# （详见 web-api/deploy/letsencrypt-hooks/README.md）。
