# DD-INVEST V3 公网 API vhost — api.oddfi.io
#
# 部署目标：/etc/nginx/sites-available/api.oddfi.io
# 启用：sudo ln -s /etc/nginx/sites-available/api.oddfi.io /etc/nginx/sites-enabled/
#
# 关联：deploy-state-audit-2026-05-27.md §4.5 / Task #10
#
# 设计要点：
#   - 公网开放（无 IP allow），前端 + 移动端用户直接访问
#   - 只监听 :443；:80 留给 web-api 容器（host network）继续兼容期 HTTP 直访
#   - 反代到 http://127.0.0.1:80 = web-api 容器（同机回环，零延迟）
#   - certbot standalone 模式自动续期，与 admin-api.oddfi.io 共用 pre/post hook
#     （hook 停启 web-api 释放 :80，详见 deploy/letsencrypt-hooks/README.md）
#
# 前置：
#   1. DNS api.oddfi.io A → <SERVER_IP>
#   2. cert: sudo certbot certonly --standalone -d api.oddfi.io
#   3. /etc/letsencrypt/renewal-hooks/{pre,post}/ 已 install
#
# 限流（暂未启用）：
#   公网流量后续可在 nginx.conf 内加
#     limit_req_zone $binary_remote_addr zone=public_api:10m rate=30r/s;
#   然后在 location /api/ 内 limit_req zone=public_api burst=20 nodelay;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.oddfi.io;

    ssl_certificate     /etc/letsencrypt/live/api.oddfi.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.oddfi.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    server_tokens off;

    # 反代到 web-api 容器（host network, listen :80）
    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 同机 loopback，超时收紧
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    30s;

        # 大 body（presale report-tx 等不大，但留 buffer）
        client_max_body_size  2m;
    }
}

# 注意：不监听 :80
# 原因：oddfi-backend EC2 的 :80 被 web-api 容器占用（host network 直暴）。
# api.oddfi.io HTTP 走 web-api :80，HTTPS 走本 nginx vhost → web-api :80。
# 前端可继续通过 http://api.oddfi.io 兼容访问（不经 nginx），
# 推荐配置 BACKEND_URL=https://api.oddfi.io 强制 TLS。
