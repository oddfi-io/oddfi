  /account/portfolio/history:
    get:
      description: 聚合资金流水、普通注单和 Banner 注单，用于前端资产 History 列表。
      parameters:
      - description: 排序字段，可选 created_at / amount
        in: query
        name: order_by
        type: string
      - description: 排序方向，可选 asc / desc
        in: query
        name: sort
        type: string
      - description: 搜索关键词，模糊匹配赛事或市场信息
        in: query
        name: search
        type: string
      - description: 交易类型筛选，支持逗号分隔多选；合法枚举：all / bet / bet_cancel / bet_won / bet_lost / bet_banner / claim_prize / withdraw / deposit / stake / unstake / add_lp / remove_lp / cancel_withdraw。type=bet 表示所有下注流水，不按结算状态过滤；示例：type=bet,bet_cancel,claim_prize
        in: query
        name: type
        type: string
      - description: 赛果筛选，可选 all / won / lost / push / void
        in: query
        name: result
        type: string
      - description: 开始日期，格式 YYYY-MM-DD
        in: query
        name: begin_date
        type: string
      - description: 结束日期，格式 YYYY-MM-DD
        in: query
        name: end_date
        type: string
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 20，最大 50
        in: query
        name: page_size
        type: integer
      - description: My Bets 场景：active / settled
        in: query
        name: tab
        type: string
      - description: 兼容旧前端 status=active/settled
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.swaggerBetHistoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.swaggerEmptyResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.swaggerEmptyResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.swaggerEmptyResponse'
      security:
      - BearerAuth: []
      summary: 查询 Portfolio History
      tags:
      - account
