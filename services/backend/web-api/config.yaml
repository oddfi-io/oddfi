# 本地前端联调配置（指向本地 docker mysql/redis）
# ⚠️ 不入 git；前端联调结束后执行 git checkout web-api/config.yaml 还原
server:
  host: "0.0.0.0"
  port: 8082
  mode: "debug"
  env: "dev"

database:
  host: "127.0.0.1"
  port: 3306
  username: "root"
  password: "123456"
  dbname: "oddfi_dev"
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 3600

redis:
  host: "127.0.0.1"
  port: 6379
  password: ""
  db: 0
  pool_size: 50

jwt:
  secret: "frontend-integration-secret-32chars-only-for-local"
  access_expiry: 86400
  refresh_expiry: 604800

rate_limit:
  enabled: false
  requests_per_second: 100
  burst_size: 200
