version: '3.8'

services:
  cron-job:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oddfi-cron-job
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
      - APP_PORT=8080
      - LOG_LEVEL=info
      - LOG_ENCODING=json
    volumes:
      # 挂载配置文件（可选，如果不想重新构建镜像可以修改配置）
      - ./internal/config/config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cron-network

networks:
  cron-network:
    driver: bridge
